<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vietnamese learning – Webtools</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <style>
        a.back { margin-bottom: 1rem; display: inline-block; }
        .word-btn {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 0.15em;
        }
        .word-btn:hover { color: var(--accent, #0b57d0); }
        .word-btn:focus {
            outline: 2px solid var(--accent, #0b57d0);
            outline-offset: 2px;
        }
        .audio-notice {
            margin-top: 1rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            background: #e8f4fc;
            border: 1px solid #6af;
            color: #036;
        }
        .audio-notice--error {
            background: #fdd;
            border-color: #f66;
            color: #800;
        }
        .audio-notice:empty { display: none; }
        table.word-table { margin-top: 1rem; }
        .attribution { margin-top: 1.5rem; font-size: 0.9rem; opacity: 0.95; }
    </style>
</head>
<body>
    <a class="back" href="../index.html">← Back</a>
    <h1>Vietnamese learning</h1>
    <p>Native Vietnamese numbers 1–10. Click a word to hear the pronunciation (plays on this page; no new tab).</p>

    <table class="word-table">
        <thead>
            <tr>
                <th scope="col">Number</th>
                <th scope="col">Vietnamese (click to hear)</th>
            </tr>
        </thead>
        <tbody id="vietnameseEntries"></tbody>
    </table>

    <p id="audioNotice" class="audio-notice" role="status" aria-live="polite" hidden></p>

    <audio id="audioPlayer" preload="none"></audio>

    <p class="attribution">
        Recordings from
        <a href="https://www.omniglot.com/language/numbers/vietnamese.htm" rel="noopener noreferrer">Omniglot — Vietnamese numbers</a>
        (information and recordings by Greg Vanderford).
    </p>

    <script src="../js/vietnamese-learning.js"></script>
</body>
</html>
