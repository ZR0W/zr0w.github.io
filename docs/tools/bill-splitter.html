<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill splitter – Webtools</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <style>
        a.back { margin-bottom: 1rem; display: inline-block; }
        .intro details { margin-top: 0.5rem; font-size: 0.95rem; color: #444; }
        .panel {
            margin: 1rem 0;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 6px;
        }
        .panel h2 { margin-top: 0; font-size: 1.1rem; }
        .item-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .item-row input[type="text"] { flex: 1 1 10rem; min-width: 8rem; }
        .item-row input[type="number"] { width: 6rem; }
        .item-row button {
            padding: 0.35rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
        }
        .item-row button:hover { background: #eee; }
        .item-row button.remove { color: #800; border-color: #c88; }
        .item-row button.remove .remove-short { display: none; }
        .toolbar { margin-top: 0.75rem; }
        .toolbar button {
            padding: 0.45rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #333;
            background: #fff;
        }
        .toolbar button:hover { background: #eee; }
        .summary-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.5rem 1rem;
            align-items: center;
            max-width: 20rem;
        }
        .summary-grid label { font-weight: bold; }
        .summary-grid label.total-label { font-size: 1.05rem; }
        .summary-grid input[type="number"] { width: 100%; max-width: 8rem; }
        .summary-grid input#total { font-weight: bold; }
        .summary-grid .field-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .summary-grid button.linkish {
            padding: 0.2rem 0.5rem;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
        }
        .summary-grid button.linkish:hover { background: #eee; }
        .items-sum-row {
            margin-top: 0.5rem;
            font-size: 0.95rem;
            color: #444;
        }
        .items-sum-row strong { font-variant-numeric: tabular-nums; }
        table.split-table { margin-top: 1rem; width: 100%; max-width: 36rem; }
        .split-table th, .split-table td { text-align: right; }
        .split-table th:first-child, .split-table td:first-child { text-align: left; }
        .split-table .request { font-weight: bold; font-variant-numeric: tabular-nums; }
        .notice {
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            margin: 0.75rem 0;
            min-height: 1.5rem;
        }
        .notice.error { background: #fdd; border: 1px solid #f66; color: #800; }
        .notice.warn { background: #fff8e6; border: 1px solid #da0; color: #630; }
        .notice.info { background: #e8f4fc; border: 1px solid #6af; color: #036; }
        .notice:empty { display: none; }
        .totals-foot { font-weight: bold; }

        @media (max-width: 600px) {
            .item-row {
                display: grid;
                grid-template-columns: 1fr auto;
                grid-template-rows: auto auto;
                gap: 0.5rem;
                margin-bottom: 0.75rem;
            }
            .item-row input[type="text"] {
                grid-column: 1 / -1;
                width: 100%;
                min-width: 0;
            }
            .item-row input[type="number"] {
                width: 100%;
                min-width: 0;
                min-height: 44px;
                font-size: 16px;
            }
            .item-row input[type="text"] {
                min-height: 44px;
                font-size: 16px;
            }
            .item-row button.remove {
                min-width: 44px;
                min-height: 44px;
                padding: 0 0.75rem;
                font-size: 1.25rem;
                line-height: 1;
            }
            .item-row button.remove .remove-long { display: none; }
            .item-row button.remove .remove-short { display: inline; }

            .toolbar button,
            .summary-grid button.linkish {
                width: 100%;
                min-height: 44px;
                padding: 0.6rem 0.75rem;
                font-size: 1rem;
            }

            .summary-grid {
                grid-template-columns: 1fr;
                max-width: none;
                gap: 0.35rem;
            }
            .summary-grid label { margin-top: 0.5rem; }
            .summary-grid label:first-of-type { margin-top: 0; }
            .summary-grid input[type="number"] {
                max-width: none;
                min-height: 44px;
                font-size: 16px;
            }
            .summary-grid input#total {
                border: 2px solid #333;
            }
            .summary-grid .field-row {
                flex-direction: column;
                align-items: stretch;
            }

            .split-table thead { display: none; }
            .split-table tbody tr,
            .split-table tfoot tr {
                display: block;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 0.75rem;
                margin-bottom: 0.75rem;
                background: #fff;
            }
            .split-table tbody td,
            .split-table tfoot td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
                text-align: right;
                padding: 0.35rem 0;
                border: none;
            }
            .split-table tbody td::before,
            .split-table tfoot td::before {
                content: attr(data-label);
                font-weight: bold;
                text-align: left;
                flex-shrink: 0;
            }
            .split-table tbody td:first-child {
                font-size: 1.05rem;
                font-weight: bold;
                border-bottom: 1px solid #eee;
                padding-bottom: 0.5rem;
                margin-bottom: 0.25rem;
            }
            .split-table tbody td:first-child::before { display: none; }
            .split-table tbody td.request {
                font-size: 1.15rem;
                border-top: 1px solid #eee;
                padding-top: 0.5rem;
                margin-top: 0.25rem;
            }
            .split-table tfoot tr {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #f5f5f5;
                margin-bottom: 0;
            }
            .split-table tfoot td {
                display: block;
                padding: 0;
            }
            .split-table tfoot td::before {
                display: none;
            }
            .split-table tfoot td:last-child {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <a class="back" href="../index.html">← Back</a>
    <h1>Bill splitter</h1>
    <div class="intro">
        <p>Split a bill: enter items, subtotal, and total.</p>
        <details>
            <summary>How it works</summary>
            <p>Total updates from subtotal + tax + tip — or enter total directly (tax and tip clear). Each request = item price ÷ subtotal × total.</p>
        </details>
    </div>

    <div class="panel">
        <h2>Items</h2>
        <div id="itemList" aria-label="Bill items"></div>
        <div class="toolbar">
            <button type="button" id="addItemBtn">+ Add item</button>
        </div>
        <p class="items-sum-row">Items sum: <strong id="itemsSum">—</strong></p>
    </div>

    <div class="panel">
        <h2>Bill summary</h2>
        <div class="summary-grid">
            <label for="subtotal">Subtotal</label>
            <div class="field-row">
                <input type="number" id="subtotal" min="0" step="0.01" placeholder="0.00" inputmode="decimal" autocomplete="off">
                <button type="button" class="linkish" id="useItemsSumBtn">Use items sum</button>
            </div>
            <label for="tax">Tax</label>
            <input type="number" id="tax" min="0" step="0.01" placeholder="0.00" inputmode="decimal" autocomplete="off">
            <label for="tip">Tip</label>
            <input type="number" id="tip" min="0" step="0.01" placeholder="0.00" inputmode="decimal" autocomplete="off">
            <label for="total" class="total-label">Total</label>
            <input type="number" id="total" min="0" step="0.01" placeholder="0.00" inputmode="decimal" autocomplete="off">
        </div>
    </div>

    <div id="notice" class="notice" role="status"></div>

    <table class="split-table" id="resultsTable" hidden>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Share</th>
                <th>Request</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
        <tfoot>
            <tr class="totals-foot">
                <td colspan="3">Sum of requests</td>
                <td id="requestsSum">—</td>
            </tr>
        </tfoot>
    </table>

    <script src="../js/bill-splitter.js"></script>
</body>
</html>
