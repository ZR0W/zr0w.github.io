<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker card probability – Webtools</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <style>
        .card-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 1rem 0; }
        .card-btn {
            min-width: 3rem; height: 3.5rem; padding: 0.25rem 0.5rem;
            font-size: 1.1rem; font-weight: bold; border-radius: 6px;
            border: 2px solid #333; background: #fff; cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .card-btn:hover { background: #e8e8e8; transform: translateY(-1px); }
        .card-btn.drawn { background: #ddd; color: #666; border-color: #999; }
        .card-btn.drawn.full { background: #ccc; color: #555; cursor: not-allowed; }
        .card-btn .count { font-size: 0.7rem; font-weight: normal; opacity: 0.9; }
        .notice { padding: 0.5rem 0.75rem; border-radius: 6px; margin: 0.75rem 0; min-height: 1.5rem; }
        .notice.error { background: #fdd; border: 1px solid #f66; color: #800; }
        .notice.info { background: #e8f4fc; border: 1px solid #6af; color: #036; }
        .notice:empty { display: none; }
        .undo-row { margin: 0.5rem 0; }
        .undo-btn { padding: 0.4rem 0.8rem; cursor: pointer; border-radius: 6px; }
        table.prob-table { margin-top: 1rem; }
        .prob-table th, .prob-table td { text-align: right; }
        .prob-table th:first-child, .prob-table td:first-child { text-align: left; }
        .prob-pct { font-variant-numeric: tabular-nums; }
        a.back { margin-bottom: 1rem; display: inline-block; }
    </style>
</head>
<body>
    <a class="back" href="../index.html">← Back</a>
    <h1>Poker card probability</h1>
    <p>Click a card value to mark it as drawn. Probabilities update for the next card from the remaining deck.</p>

    <div class="card-row" id="cardRow" aria-label="Card values (click to mark drawn)"></div>
    <div class="undo-row">
        <button type="button" class="undo-btn" id="undoBtn" disabled>Undo last draw</button>
    </div>
    <div class="notice" id="notice" role="alert"></div>

    <h2>Probability table</h2>
    <p><strong>Cards left in deck:</strong> <span id="cardsLeft">52</span></p>
    <table class="prob-table" id="probTable">
        <thead>
            <tr>
                <th>Card</th>
                <th>Remaining</th>
                <th>P(next card)</th>
            </tr>
        </thead>
        <tbody id="probBody"></tbody>
    </table>

    <script src="../js/poker-probability.js"></script>
</body>
</html>
